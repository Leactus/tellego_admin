<div class="layout">
  @if (sidebarOpen()) {
    <div class="backdrop" (click)="closeSidebar()"></div>
  }

  <aside class="sidebar" [class.open]="sidebarOpen()" [class.collapsed]="sidebarCollapsed()">
    <div class="brand">
      <img class="brand-mark" src="/logo/logo-tellego.webp" alt="Te llego" />
      <img class="brand-mark-compact" src="/logo/isotipo-tellego.webp" alt="Te llego" />
      <span class="brand-name"></span>
    </div>

    <nav class="menu">
      @for (entry of menu; track entry.key) {
        @if (entry.children) {
          <button
            type="button"
            class="menu-item menu-group-toggle"
            [class.active]="isGroupOpen(entry.key)"
            (click)="toggleGroup(entry.key)"
          >
            <app-icon class="menu-icon" [name]="entry.icon" />
            <span class="menu-label">{{ entry.label }}</span>
            <app-icon class="menu-chevron" name="chevron-down" [class.rotated]="isGroupOpen(entry.key)" />
          </button>
          @if (isGroupOpen(entry.key)) {
            <div class="menu-submenu">
              @for (item of entry.children; track item.path) {
                <a class="menu-item menu-subitem" [routerLink]="item.path" routerLinkActive="active" (click)="closeSidebar()">
                  <app-icon class="menu-icon" [name]="item.icon" />
                  <span class="menu-label">{{ item.label }}</span>
                </a>
              }
            </div>
          }
        } @else {
          <a class="menu-item" [routerLink]="entry.path" routerLinkActive="active" (click)="closeSidebar()">
            <app-icon class="menu-icon" [name]="entry.icon" />
            <span class="menu-label">{{ entry.label }}</span>
          </a>
        }
      }
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-user" (click)="logout()" title="Cerrar sesión">
        <span class="user-avatar">
          <app-icon name="logout" />
        </span>
        <span class="user-name">Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Abrir menú">
        <app-icon name="menu" />
      </button>
      <span class="topbar-title">Panel</span>
      <div class="topbar-user">
        <span class="user-avatar">{{ userInitial() }}</span>
        <span class="user-name">{{ user()?.name }}</span>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
