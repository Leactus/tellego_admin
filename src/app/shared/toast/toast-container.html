<!-- El stack queda siempre montado (vacío no ocupa espacio ni bloquea clics) para que cada toast
     pueda animar su salida con animate.leave antes de removerse del DOM. -->
<div class="toast-stack">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="toast.type" role="status" animate.leave="toast-leave">
      <span class="toast-icon">
        <app-icon [name]="iconFor(toast.type)" />
      </span>
      <span class="toast-message">{{ toast.message }}</span>
      <button class="toast-close" (click)="toastService.dismiss(toast.id)" aria-label="Cerrar notificación">
        <app-icon name="close" />
      </button>
      <span class="toast-progress" aria-hidden="true"></span>
    </div>
  }
</div>
