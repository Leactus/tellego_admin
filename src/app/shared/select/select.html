<div class="app-select" [class.open]="isOpen()">
  <button
    #trigger
    type="button"
    class="select-trigger"
    [class.invalid]="invalid"
    [disabled]="disabled"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="listbox"
    (click)="toggle()"
  >
    <span class="select-value" [class.placeholder]="!selectedLabel">{{ selectedLabel ?? placeholder }}</span>
    <app-icon name="chevron-down" class="select-chevron" />
  </button>

  @if (isOpen()) {
    <div
      class="select-panel"
      role="listbox"
      [style.left.px]="panelPosition().left"
      [style.width.px]="panelPosition().width"
      [style.top.px]="panelPosition().top"
      [style.bottom.px]="panelPosition().bottom"
    >
      @if (showSearch) {
        <div class="select-search">
          <app-icon name="search" />
          <input
            type="text"
            [ngModel]="searchQuery()"
            (ngModelChange)="onSearchInput($event)"
            placeholder="Buscar..."
            spellcheck="false"
            (click)="$event.stopPropagation()"
          />
        </div>
      }

      @if (loading) {
        <p class="select-empty">Buscando…</p>
      } @else if (filteredOptions.length === 0) {
        <p class="select-empty">Sin resultados</p>
      } @else if (useVirtualScroll) {
        <cdk-virtual-scroll-viewport itemSize="36" class="select-options select-options-virtual">
          <div
            class="select-option"
            role="option"
            *cdkVirtualFor="let option of filteredOptions; trackBy: trackByValue"
            [attr.aria-selected]="isSelected(option)"
            [class.selected]="isSelected(option)"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </div>
        </cdk-virtual-scroll-viewport>
      } @else {
        <div class="select-options select-options-plain">
          @for (option of filteredOptions; track option.value) {
            <div
              class="select-option"
              role="option"
              [attr.aria-selected]="isSelected(option)"
              [class.selected]="isSelected(option)"
              (click)="selectOption(option)"
            >
              {{ option.label }}
            </div>
          }
        </div>
      }
    </div>
  }
</div>
