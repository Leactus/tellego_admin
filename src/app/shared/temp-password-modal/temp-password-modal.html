@if (info(); as data) {
  <div class="modal-backdrop">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ data.title }}</h2>
        <button class="modal-close" (click)="close()" aria-label="Cerrar">
          <app-icon name="close" />
        </button>
      </div>

      <div class="modal-body">
        <p class="muted">
          Comparte estas credenciales con la persona. La contraseña <strong>no se puede volver a consultar</strong>
          después de cerrar esta ventana.
        </p>

        <div class="credentials-box">
          <div class="credential-row">
            <span class="muted">Email</span>
            <span class="credential-value">{{ data.email }}</span>
          </div>
          <div class="credential-row">
            <span class="muted">Contraseña temporal</span>
            <span class="credential-value">{{ data.password }}</span>
          </div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" (click)="copyPassword()">Copiar contraseña</button>
        <button class="btn-primary" (click)="close()">Listo</button>
      </div>
    </div>
  </div>
}
