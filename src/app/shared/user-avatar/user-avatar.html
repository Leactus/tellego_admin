<span
  class="user-avatar"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [style.font-size.px]="size() * 0.5"
  [attr.title]="name() || null"
>
  @if (showImage()) {
    <img [src]="src()" [alt]="name() ? 'Foto de ' + name() : 'Foto de perfil'" loading="lazy" (error)="onError()" />
  } @else {
    <app-icon name="user" />
  }
</span>
