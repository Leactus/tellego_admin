<div class="location-field">
  <span class="location-label">Ubicación del negocio</span>

  <button type="button" class="btn-secondary" [disabled]="isLocating()" (click)="useCurrentLocation()">
    <app-icon name="locate" />
    {{ isLocating() ? 'Obteniendo ubicación…' : 'Usar mi ubicación actual' }}
  </button>

  <app-location-map [lat]="lat()" [lng]="lng()" [myLocation]="myLocation()" (locationChange)="onMapLocationChange($event)" />

  <p class="location-warning">
    <app-icon name="info-circle" />
    El pin verde es la ubicación del negocio y queda fijo en el centro — busca la dirección o arrastra el mapa para
    ajustarlo. El punto azul marca dónde estás parado ahora mismo, como referencia.
  </p>
</div>
